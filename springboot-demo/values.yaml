replicaCount: 2

image:
  repository: adasgupt86/springboot-demo
  pullPolicy: IfNotPresent
  tag: "9"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceAccount:
  create: false
  automount: false
  name: ""

service:
  type: ClusterIP
  port: 8080

containerPort: 8080


resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi


ingress:
  enabled: false


config:
  APP_NAME: springboot-demo
  ENV: dev

