---
# Source: springboot-demo/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap

metadata:
  name: springboot-demo-config

data:
  APP_NAME: springboot-demo
  ENV: dev

---
# Source: springboot-demo/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: springboot-demo
  labels:
    helm.sh/chart: springboot-demo-0.1.0
    app.kubernetes.io/name: springboot-demo
    app.kubernetes.io/instance: springboot-demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: springboot-demo
    app.kubernetes.io/instance: springboot-demo

---
# Source: springboot-demo/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo
  labels:
    helm.sh/chart: springboot-demo-0.1.0
    app.kubernetes.io/name: springboot-demo
    app.kubernetes.io/instance: springboot-demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: springboot-demo
      app.kubernetes.io/instance: springboot-demo
  template:
    metadata:
      labels:
        helm.sh/chart: springboot-demo-0.1.0
        app.kubernetes.io/name: springboot-demo
        app.kubernetes.io/instance: springboot-demo
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      containers:
        - name: springboot-demo
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          image: "adasgupt86/springboot-demo:9"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
